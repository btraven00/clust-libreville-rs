[package]
name = "cluster-libreville-py"
version = "0.1.0"
edition = "2021"
publish = false
description = "Python bindings for clust-libreville-rs"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
clust-libreville-rs = { path = ".." }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[profile.release]
lto = true
codegen-units = 1
