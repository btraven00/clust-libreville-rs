[package]
name = "detleiden-py"
version = "0.0.1"
edition = "2021"
publish = false
description = "Python bindings for detleiden"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
detleiden = { path = ".." }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[profile.release]
lto = true
codegen-units = 1
