[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sc-cluster-libreville"
description = "Parallel and deterministic implementation of the Leiden community detection algorithm"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ben Carrillo", email = "ben.uzh@proton.me" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
dynamic = ["version"]
keywords = ["leiden", "community detection", "clustering", "single-cell", "graph"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/btraven00/clust-libreville-rs"
Issues = "https://github.com/btraven00/clust-libreville-rs/issues"

[project.optional-dependencies]
scanpy = ["anndata", "pandas"]
test = ["pytest", "scipy"]

[tool.maturin]
python-source = "python"
module-name = "cluster_libreville._core"
features = ["pyo3/extension-module"]
