[package]
name = "detleiden"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Seeded, deterministic Leiden community detection: the same labels for the same seed at any thread count"
publish = false
# what a package (crates.io, the Python sdist) ships: the library only
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
rayon = "1"
cubecl = { version = "0.11", optional = true }

[features]
# GPU backends (cubecl); none by default. One runtime per build.
gpu-cuda = ["dep:cubecl", "cubecl/cuda"]
gpu-wgpu = ["dep:cubecl", "cubecl/wgpu"]
gpu-metal = ["dep:cubecl", "cubecl/metal-native", "gpu-f32"]
# kernels in f32 (devices without f64); implied by gpu-metal, also usable with gpu-cuda for testing
gpu-f32 = []

[dev-dependencies]
npyz = { version = "0.8", features = ["npz"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "leiden"
harness = false

[profile.release]
debug = 1
