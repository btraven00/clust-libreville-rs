# Python wheels (abi3: one per platform, Python >= 3.10) and the sdist; tests on each built wheel;
# a tag v* publishes to PyPI with trusted publishing (configure the "pypi" environment on PyPI first).
name: python

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-14, target: aarch64 }
          - { os: windows-2022, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m python/Cargo.toml
          manylinux: "2014"
      - name: Test the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest scipy polars anndata pandas
          python -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-${{ matrix.os }}-${{ matrix.target }}", path: dist }

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with: { command: sdist, args: --out dist -m python/Cargo.toml }
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
